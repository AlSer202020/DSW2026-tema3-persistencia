{% extends "base.html" %}
{% block title %}Producto: {{ producto.nombre }}{% endblock %}

{% block content %}
<h1>{{ producto.nombre }}</h1>
<h2>{{ producto.precio }} €</h2>
{% if producto.imagen %}
<img src="{{ url_for('static', filename='img/uploads/' + producto.imagen) }}" alt="{{ producto.nombre }}">
{% endif %}
{% endblock %}
